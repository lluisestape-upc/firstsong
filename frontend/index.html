<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>First Song</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="overlay" class="overlay">
      <div class="card">
        <header class="masthead">
          <p class="kicker">A world as a gift</p>
          <h1 id="world-title">First Song</h1>
        </header>

        <nav id="songs" class="songs" aria-label="Song"></nav>

        <div id="modes" class="modes" role="radiogroup" aria-label="Mode">
          <button class="mode" data-mode="gather" role="radio" aria-checked="true" aria-label="Gather">
            <svg class="thumb" viewBox="0 0 120 76" aria-hidden="true">
              <g class="dots">
                <circle cx="24" cy="26" r="6" class="off" style="--i:0"/>
                <circle cx="58" cy="16" r="6" class="off" style="--i:1"/>
                <circle cx="96" cy="30" r="6" class="off" style="--i:2"/>
                <circle cx="80" cy="58" r="6" class="off" style="--i:3"/>
                <circle cx="38" cy="58" r="7" class="on"/>
              </g>
              <path class="walk" d="M38 58 L24 26" />
            </svg>
            <img class="shot" src="modes/gather.webp" alt=""
                 onerror="this.remove()">
            <span class="what">Gather</span>
          </button>

          <button class="mode" data-mode="wander" role="radio" aria-checked="false" aria-label="Wander">
            <svg class="thumb" viewBox="0 0 120 76" aria-hidden="true">
              <g class="dots">
                <circle cx="22" cy="24" r="6" class="on"/>
                <circle cx="58" cy="15" r="6" class="on"/>
                <circle cx="98" cy="28" r="6" class="on"/>
                <circle cx="82" cy="60" r="6" class="on"/>
                <circle cx="34" cy="56" r="6" class="on"/>
              </g>
              <path id="wanderPath" class="route"
                    d="M14 66 C 36 40, 30 20, 56 30 S 92 58, 110 34" />
              <circle r="3.5" class="walker">
                <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
                  <mpath href="#wanderPath"/>
                </animateMotion>
              </circle>
            </svg>
            <img class="shot" src="modes/wander.webp" alt=""
                 onerror="this.remove()">
            <span class="what">Wander</span>
          </button>

          <button class="mode" data-mode="blind" role="radio" aria-checked="false" aria-label="Blind">
            <svg class="thumb" viewBox="0 0 120 76" aria-hidden="true">
              <g class="dots">
                <circle cx="26" cy="22" r="6" class="hidden-dot"/>
                <circle cx="62" cy="14" r="6" class="hidden-dot"/>
                <circle cx="96" cy="52" r="6" class="hidden-dot"/>
                <circle cx="34" cy="58" r="6" class="hidden-dot"/>
              </g>
              <g class="sonar">
                <circle cx="74" cy="38" r="7" class="on"/>
                <circle cx="74" cy="38" r="7" class="ping" style="--d:0s"/>
                <circle cx="74" cy="38" r="7" class="ping" style="--d:1s"/>
                <circle cx="74" cy="38" r="7" class="ping" style="--d:2s"/>
              </g>
            </svg>
            <img class="shot" src="modes/blind.webp" alt=""
                 onerror="this.remove()">
            <span class="what">Blind</span>
          </button>
        </div>

        <button id="enter" disabled>Loading…</button>
        <p class="controls">W A S D walk &middot; mouse look &middot; E take &middot; Q hush &middot; F listen alone &middot; Space jump &middot; R replay &middot; Esc let go</p>
      </div>
    </div>

    <div id="hud" class="hud hidden">
      <div id="stem-readout"></div>
      <div id="meta"></div>
      <button id="pause" class="pause" title="Stop the song (Esc)">Stop the song</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
