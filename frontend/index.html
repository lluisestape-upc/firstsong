<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>First Song</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="overlay" class="overlay">
      <div class="card">
        <header class="masthead">
          <p class="kicker">A world as a gift</p>
          <h1 id="world-title">First Song</h1>
        </header>

        <nav id="songs" class="songs" aria-label="Song"></nav>

        <div id="modes" class="modes" role="radiogroup" aria-label="Mode">
          <button class="mode" data-mode="discover" role="radio" aria-checked="true" aria-label="Discover">
            <svg class="thumb" viewBox="0 0 120 76" aria-hidden="true">
              <g class="dots">
                <circle cx="20" cy="30" r="6" class="off" style="--i:0"/>
                <circle cx="46" cy="60" r="6" class="off" style="--i:1"/>
                <circle cx="76" cy="60" r="6" class="off" style="--i:2"/>
                <circle cx="100" cy="30" r="6" class="off" style="--i:3"/>
              </g>
              <g class="falling">
                <ellipse cx="60" cy="40" rx="17" ry="5" class="tabletop"/>
              </g>
            </svg>
            <img class="shot" src="modes/discover.webp" alt=""
                 onerror="this.remove()">
            <span class="what">Discover</span>
          </button>

          <button class="mode" data-mode="play" role="radio" aria-checked="false" aria-label="Play">
            <svg class="thumb" viewBox="0 0 120 76" aria-hidden="true">
              <ellipse cx="60" cy="42" rx="44" ry="22" class="tabletop"/>
              <g class="rim">
                <circle cx="22" cy="40" r="4.5" class="on"/>
                <circle cx="60" cy="22" r="4.5" class="on"/>
                <circle cx="98" cy="40" r="4.5" class="on"/>
                <circle cx="60" cy="61" r="4.5" class="on"/>
              </g>
              <path id="wireA" class="wire" d="M22 40 L40 33 L52 42"/>
              <path id="wireB" class="wire" d="M98 40 L80 48"/>
              <rect x="36" y="29" width="8" height="8" rx="4" class="puck p1"/>
              <rect x="48" y="38" width="8" height="8" rx="4" class="puck p2"/>
              <rect x="76" y="44" width="8" height="8" rx="4" class="puck p3"/>
              <circle r="2" class="packet"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#wireA"/></animateMotion></circle>
              <circle r="2" class="packet"><animateMotion dur="1.2s" begin="-0.6s" repeatCount="indefinite"><mpath href="#wireB"/></animateMotion></circle>
            </svg>
            <img class="shot" src="modes/play.webp" alt=""
                 onerror="this.remove()">
            <span class="what">Play</span>
          </button>
        </div>

        <button id="enter" disabled>Loading…</button>
        <p class="controls">W A S D walk &middot; mouse look &middot; F listen &middot; E take &middot; Enter inside an effect &middot; Esc let go</p>
      </div>
    </div>

    <div id="hud" class="hud hidden">
      <div id="stem-readout"></div>
      <div id="meta"></div>
      <button id="pause" class="pause" title="Stop the song (Esc)">Stop the song</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
